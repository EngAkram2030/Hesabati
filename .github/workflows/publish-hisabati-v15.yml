name: Publish Hisabati V15

on:
  push:
    paths:
      - ".github/workflows/publish-hisabati-v15.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild approved landing page
        shell: bash
        run: |
          cat > /tmp/hisabati-site.b64 <<'HISABATI_EOF'




          HISABATI_EOF
          tr -d '\n\r' < /tmp/hisabati-site.b64 | base64 -d | gunzip > index.html

      - name: Commit approved page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish approved Hisabati landing page V15"
          git push
