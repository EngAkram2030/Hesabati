name: Publish Hisabati V15 Final

on:
  push:
    paths:
      - ".publish/v15.ready"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build approved page
        shell: bash
        run: |
          cat .publish/v15.part1 .publish/v15.part2 .publish/v15.part3 .publish/v15.part4 .publish/v15.part5 | base64 -d | gunzip > index.html
          test -s index.html
          grep -q "خلّ عينك" index.html

      - name: Publish to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Approved page already published"
            exit 0
          fi
          git commit -m "Publish approved Hisabati landing page V15"
          git push
